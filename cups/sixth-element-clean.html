<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sixth Element</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Josefin+Sans:wght@100;200&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1319;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8rem;
      padding: 6rem 4rem;
    }
  </style>
</head>
<body>

  <!-- LARGE CUP -->
  <svg width="280" height="400" viewBox="0 0 280 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="cup" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"   stop-color="#0d1525"/>
        <stop offset="30%"  stop-color="#182038"/>
        <stop offset="60%"  stop-color="#162038"/>
        <stop offset="100%" stop-color="#0d1525"/>
      </linearGradient>
      <linearGradient id="lid" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"  stop-color="#1e2840"/>
        <stop offset="100%" stop-color="#090e1a"/>
      </linearGradient>
      <linearGradient id="ochre" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#a07018"/>
        <stop offset="40%"  stop-color="#d4a030"/>
        <stop offset="70%"  stop-color="#c49028"/>
        <stop offset="100%" stop-color="#8a5e10"/>
      </linearGradient>
      <radialGradient id="shadow" cx="50%" cy="50%">
        <stop offset="0%"   stop-color="#000" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- Shadow -->
    <ellipse cx="140" cy="397" rx="95" ry="8" fill="url(#shadow)"/>

    <!-- Cup body -->
    <path d="M 40 78 L 240 78 L 222 375 Q 222 386 140 388 Q 58 386 58 375 Z" fill="url(#cup)"/>

    <!-- Bottom -->
    <ellipse cx="140" cy="382" rx="82" ry="7" fill="#090e1a"/>

    <!-- Subtle left highlight -->
    <path d="M 48 85 L 64 372" stroke="#1e2d4a" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

    <!-- LID -->
    <ellipse cx="140" cy="78" rx="100" ry="18" fill="url(#lid)"/>
    <path d="M 44 74 Q 140 38 236 74 L 238 78 Q 140 43 42 78 Z" fill="url(#lid)"/>
    <ellipse cx="140" cy="52" rx="82"  ry="11" fill="#111926"/>
    <!-- Tab -->
    <rect x="110" y="43" width="60" height="10" rx="5" fill="#0d1420" stroke="#1e2840" stroke-width="0.6"/>
    <rect x="122" y="46" width="36" height="5"  rx="2.5" fill="#090e18"/>

    <!-- ── MARK: clean hex, no rings ── -->
    <g transform="translate(140, 205)">
      <!-- Outer hex only -->
      <polygon
        points="0,-55 47,-27.5 47,27.5 0,55 -47,27.5 -47,-27.5"
        stroke="url(#ochre)" stroke-width="1.4" fill="none"/>
      <!-- Spokes to center -->
      <line x1="0" y1="0" x2="0"   y2="-47" stroke="url(#ochre)" stroke-width="0.7" opacity="0.4"/>
      <line x1="0" y1="0" x2="40"  y2="-23" stroke="url(#ochre)" stroke-width="0.7" opacity="0.4"/>
      <line x1="0" y1="0" x2="40"  y2="23"  stroke="url(#ochre)" stroke-width="0.7" opacity="0.4"/>
      <line x1="0" y1="0" x2="0"   y2="47"  stroke="url(#ochre)" stroke-width="0.7" opacity="0.4"/>
      <line x1="0" y1="0" x2="-40" y2="23"  stroke="url(#ochre)" stroke-width="0.7" opacity="0.4"/>
      <line x1="0" y1="0" x2="-40" y2="-23" stroke="url(#ochre)" stroke-width="0.7" opacity="0.4"/>
      <!-- Center dot -->
      <circle cx="0" cy="0" r="5" fill="url(#ochre)"/>
      <!-- Vertex dots -->
      <circle cx="0"   cy="-47" r="3" fill="url(#ochre)" opacity="0.8"/>
      <circle cx="40"  cy="-23" r="3" fill="url(#ochre)" opacity="0.8"/>
      <circle cx="40"  cy="23"  r="3" fill="url(#ochre)" opacity="0.8"/>
      <circle cx="0"   cy="47"  r="3" fill="url(#ochre)" opacity="0.8"/>
      <circle cx="-40" cy="23"  r="3" fill="url(#ochre)" opacity="0.8"/>
      <circle cx="-40" cy="-23" r="3" fill="url(#ochre)" opacity="0.8"/>
    </g>

    <!-- Tagline — italic, small, below mark -->
    <text
      x="140" y="296"
      text-anchor="middle"
      font-family="'Cormorant Garamond', serif"
      font-style="italic"
      font-weight="400"
      font-size="14"
      fill="url(#ochre)"
      letter-spacing="2"
      opacity="0.75">
      It was always you.
    </text>

  </svg>


  <!-- SMALL CUP -->
  <svg width="185" height="268" viewBox="0 0 185 268" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="cup2" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"   stop-color="#0d1525"/>
        <stop offset="30%"  stop-color="#182038"/>
        <stop offset="60%"  stop-color="#162038"/>
        <stop offset="100%" stop-color="#0d1525"/>
      </linearGradient>
      <linearGradient id="lid2" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"  stop-color="#1e2840"/>
        <stop offset="100%" stop-color="#090e1a"/>
      </linearGradient>
      <linearGradient id="ochre2" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#a07018"/>
        <stop offset="40%"  stop-color="#d4a030"/>
        <stop offset="70%"  stop-color="#c49028"/>
        <stop offset="100%" stop-color="#8a5e10"/>
      </linearGradient>
      <radialGradient id="shadow2" cx="50%" cy="50%">
        <stop offset="0%"   stop-color="#000" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="#000" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <ellipse cx="92" cy="265" rx="65" ry="7" fill="url(#shadow2)"/>

    <path d="M 26 54 L 159 54 L 146 252 Q 146 260 92 262 Q 38 260 38 252 Z" fill="url(#cup2)"/>
    <ellipse cx="92" cy="257" rx="54" ry="6" fill="#090e1a"/>
    <path d="M 32 60 L 44 249" stroke="#1e2d4a" stroke-width="0.8" stroke-linecap="round" opacity="0.6"/>

    <!-- Lid -->
    <ellipse cx="92" cy="54" rx="67"  ry="13" fill="url(#lid2)"/>
    <path d="M 28 51 Q 92 26 156 51 L 157 54 Q 92 29 27 54 Z" fill="url(#lid2)"/>
    <ellipse cx="92" cy="54" rx="67"  ry="13" fill="none" stroke="#1a2238" stroke-width="1"/>
    <ellipse cx="92" cy="36" rx="54"  ry="8"  fill="#111926"/>
    <rect x="68" y="29" width="48" height="8" rx="4" fill="#0d1420" stroke="#1e2840" stroke-width="0.5"/>
    <rect x="78" y="32" width="28" height="4" rx="2" fill="#090e18"/>

    <!-- Mark -->
    <g transform="translate(92, 138)">
      <polygon
        points="0,-37 32,-18.5 32,18.5 0,37 -32,18.5 -32,-18.5"
        stroke="url(#ochre2)" stroke-width="1.2" fill="none"/>
      <line x1="0" y1="0" x2="0"   y2="-32" stroke="url(#ochre2)" stroke-width="0.6" opacity="0.4"/>
      <line x1="0" y1="0" x2="27"  y2="-16" stroke="url(#ochre2)" stroke-width="0.6" opacity="0.4"/>
      <line x1="0" y1="0" x2="27"  y2="16"  stroke="url(#ochre2)" stroke-width="0.6" opacity="0.4"/>
      <line x1="0" y1="0" x2="0"   y2="32"  stroke="url(#ochre2)" stroke-width="0.6" opacity="0.4"/>
      <line x1="0" y1="0" x2="-27" y2="16"  stroke="url(#ochre2)" stroke-width="0.6" opacity="0.4"/>
      <line x1="0" y1="0" x2="-27" y2="-16" stroke="url(#ochre2)" stroke-width="0.6" opacity="0.4"/>
      <circle cx="0" cy="0" r="3.5" fill="url(#ochre2)"/>
      <circle cx="0"   cy="-32" r="2.2" fill="url(#ochre2)" opacity="0.8"/>
      <circle cx="27"  cy="-16" r="2.2" fill="url(#ochre2)" opacity="0.8"/>
      <circle cx="27"  cy="16"  r="2.2" fill="url(#ochre2)" opacity="0.8"/>
      <circle cx="0"   cy="32"  r="2.2" fill="url(#ochre2)" opacity="0.8"/>
      <circle cx="-27" cy="16"  r="2.2" fill="url(#ochre2)" opacity="0.8"/>
      <circle cx="-27" cy="-16" r="2.2" fill="url(#ochre2)" opacity="0.8"/>
    </g>

    <!-- Tagline -->
    <text
      x="92" y="200"
      text-anchor="middle"
      font-family="'Cormorant Garamond', serif"
      font-style="italic"
      font-weight="400"
      font-size="10"
      fill="url(#ochre2)"
      letter-spacing="1.5"
      opacity="0.75">
      It was always you.
    </text>

  </svg>

</body>
</html>
